version: '3.8'

services:
  macosui:
    build: .
    container_name: macosui-local
    ports:
      - "8080:8080"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    env_file:
      - server/development.env
    environment:
      - PORT=8080
      - DB_TYPE=sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
