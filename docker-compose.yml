version: '3.8'

services:
  web:
    image: ${WEB_IMAGE:-macosui-local}
    build: .
    container_name: macosui-web
    extra_hosts:
      - "macosui-staging.techiespod.co.jp:host-gateway"
    # 本番・ステージング運用時はコンテナ内のdbファイルと、環境に合わせたenvファイルをマウントする
    volumes:
      - ./server/database.sqlite:/app/server/database.sqlite
      - ./server/audit_database.sqlite:/app/server/audit_database.sqlite
      # 環境変数 ENV_FILE に指定されたファイルをコンテナ内のトップレベル .env としてマウント（デフォルトは開発用）
      - ./server/${ENV_FILE:-development.env}:/app/.env
    environment:
      - NODE_ENV=development
    ports:
      - "8080:8080"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: macosui-nginx
    extra_hosts:
      - "agile-agent-staging:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
