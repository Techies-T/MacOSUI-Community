version: '3.8'

services:
  web:
    image: ${WEB_IMAGE:-macosui-local}
    build: .
    container_name: macosui-web
    # 本番・ステージング運用時はコンテナ内のdbファイルと、環境に合わせたenvファイルをマウントする
    volumes:
      - ./server/database.sqlite:/app/server/database.sqlite
      # 環境変数 ENV_FILE に指定されたファイルをコンテナ内のトップレベル .env としてマウント（デフォルトは開発用）
      - ./server/${ENV_FILE:-development.env}:/app/.env
    environment:
      - NODE_ENV=development
    # NGINXを経由しない直接アクセス用(デバッグ)に8080も公開
    ports:
      - "8080:8080"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: macosui-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # get-letsencrypt.sh で取得した証明書ファイルをマウント
      # ネイティブLinux（VPS）ではシンボリックリンク解決のためにarchive自体のマウントが必須
      - ./certbot/archive:/etc/archive:ro
      # ※ 事前に証明書を取得していないとNGINXコンテナがエラーで起動しません
      - ./certbot/live/${DOMAIN_NAME:-xxx.techiespod.co.jp}/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./certbot/live/${DOMAIN_NAME:-xxx.techiespod.co.jp}/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - web
    restart: unless-stopped

  app-server:
    image: ${APP_SERVER_IMAGE:-ghcr.io/minoru61/apprunner-mcp-server:latest}
    container_name: apprunner-mcp-server
    # 本番・ステージング運用時はコンテナ内のdbファイルと、環境に合わせたenvファイルをマウントする
    env_file:
      - ./server/${ENV_FILE:-development.env}
    ports:
      - "8085:8080"
    restart: unless-stopped
