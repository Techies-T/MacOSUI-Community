name: Deploy to AWS ECS (Fargate)

on:
  push:
    branches:
      - main

jobs:
  deploy-fargate:
    name: Build, Audit & Deploy to AWS ECS Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gate 1 - Node.js Dependency Audit (Built-in Quality)
        run: |
          echo "### 🛡️ Built-in Quality: Security Audit" >> $GITHUB_STEP_SUMMARY
          
          # Retry loop for npm registry network resilience
          MAX_RETRIES=3
          RETRY_COUNT=0
          AUDIT_SUCCESS=false

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            echo "Attempting npm audit (Attempt $((RETRY_COUNT+1))/$MAX_RETRIES)..."
            if npm audit --audit-level=critical; then
              AUDIT_SUCCESS=true
              break
            else
              echo "npm audit encountered a network or transient error. Retrying in 5 seconds..."
              RETRY_COUNT=$((RETRY_COUNT+1))
              sleep 5
            fi
          done

          if [ "$AUDIT_SUCCESS" = true ]; then
            echo "✅ **PASS**: 0 CRITICAL vulnerabilities found in npm dependencies." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAIL**: Critical vulnerabilities detected or audit failed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Auto-Provision ECS Fargate Infrastructure (CloudFormation)
        id: auto-provision
        run: |
          echo "Checking if ECS Cluster 'MacOSUI-Cluster' exists..."
          CLUSTER_EXISTS=$(aws ecs describe-clusters --clusters MacOSUI-Cluster --region ap-northeast-1 --query "clusters[?status=='ACTIVE'].clusterName" --output text || true)
          
          if [ -z "$CLUSTER_EXISTS" ] || [ "$CLUSTER_EXISTS" = "None" ]; then
            echo "🚀 ECS Cluster 'MacOSUI-Cluster' not found. Auto-creating infrastructure via CloudFormation..."
            
            # Delete old failed stack if exists
            aws cloudformation delete-stack --stack-name macosui-fargate-stack --region ap-northeast-1 || true
            aws cloudformation wait stack-delete-complete --stack-name macosui-fargate-stack --region ap-northeast-1 || true

            aws cloudformation create-stack \
              --stack-name macosui-fargate-stack \
              --template-body file://cloudformation.yaml \
              --capabilities CAPABILITY_IAM \
              --region ap-northeast-1
            
            echo "⏳ Waiting for CloudFormation stack creation to complete (this takes ~3 minutes)..."
            if ! aws cloudformation wait stack-create-complete --stack-name macosui-fargate-stack --region ap-northeast-1; then
              echo "❌ CloudFormation stack creation failed. Outputting failure events:"
              aws cloudformation describe-stack-events --stack-name macosui-fargate-stack --region ap-northeast-1 --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[LogicalResourceId, ResourceStatusReason]" --output table
              exit 1
            fi
            echo "✅ **PASS**: Infrastructure created successfully via CloudFormation." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ ECS Cluster 'MacOSUI-Cluster' already exists."
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Inject AWS Fargate Task Execution Role ARN into JSON
        id: set-execution-role
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          python3 -c "
          import json
          with open('ecs-task-definition.json', 'r') as f:
              data = json.load(f)
          data['executionRoleArn'] = 'arn:aws:iam::' + '$ACCOUNT_ID' + ':role/ECSTaskExecutionRole'
          data['taskRoleArn'] = 'arn:aws:iam::' + '$ACCOUNT_ID' + ':role/ECSTaskExecutionRole'
          with open('ecs-task-definition.json', 'w') as f:
              json.dump(data, f, indent=4)
          "
          echo "✅ Configured executionRoleArn and taskRoleArn dynamically for Account ID: $ACCOUNT_ID"

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: macosui-oss
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✅ **PASS**: Docker image built and pushed to Amazon ECR ($ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG)" >> $GITHUB_STEP_SUMMARY

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: macosui-web
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: MacOSUI-Service
          cluster: MacOSUI-Cluster
          wait-for-service-stability: true

      - name: Gate 3 - Fargate Deployment Verification Evidence
        run: |
          echo "### 🚀 AWS ECS Fargate Rollout Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ **PASS**: ECS Fargate service \`MacOSUI-Service\` updated successfully." >> $GITHUB_STEP_SUMMARY
