name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: 843109109185.dkr.ecr.ap-northeast-1.amazonaws.com/macosui-oss:latest

      - name: Setup SSH for sync
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_IP }} >> ~/.ssh/known_hosts

      - name: Sync config files using rsync
        run: |
          rsync -avz --exclude 'node_modules' \
                     --exclude '.git' \
                     --exclude 'dist' \
                     --exclude 'certbot' \
                     --exclude 'src' \
                     --exclude 'scripts' \
                     --exclude 'server/*.sqlite*' \
                     ./ ec2-user@${{ secrets.EC2_HOST_IP }}:~/MacOSUI-oss/

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # ECR Login inside EC2 using instance IAM role credentials
            aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 843109109185.dkr.ecr.ap-northeast-1.amazonaws.com
            
            cd ~/MacOSUI-oss
            
            # Deploy using updated ECR image
            export WEB_IMAGE=843109109185.dkr.ecr.ap-northeast-1.amazonaws.com/macosui-oss:latest
            
            # Pull latest image from ECR
            docker compose pull web
            
            # Ensure database.sqlite files exist as files before container startup
            touch server/database.sqlite server/audit_database.sqlite
            
            # Start containers
            docker compose up -d web nginx
