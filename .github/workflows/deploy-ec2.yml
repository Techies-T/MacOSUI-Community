name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: 843109109185.dkr.ecr.ap-northeast-1.amazonaws.com/macosui-oss:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # ECR Login inside EC2 using token from Actions
            echo "${{ steps.login-ecr.outputs.password }}" | docker login --username AWS --password-stdin 843109109185.dkr.ecr.ap-northeast-1.amazonaws.com
            
            # Setup project directory
            if [ ! -d "~/MacOSUI-oss" ]; then
              git clone https://github.com/Techies-T/MacOSUI-oss.git ~/MacOSUI-oss
            fi
            
            cd ~/MacOSUI-oss
            
            # Pull latest git changes (for config/compose files)
            git fetch origin main
            git reset --hard origin/main
            
            # Deploy using updated ECR image
            export WEB_IMAGE=843109109185.dkr.ecr.ap-northeast-1.amazonaws.com/macosui-oss:latest
            
            # Pull latest image from ECR
            docker compose pull web
            
            # Start container (we only launch web for HTTP test, ignoring missing SSL certs for Nginx)
            docker compose up -d web app-server
