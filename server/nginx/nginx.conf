events {
    worker_connections 1024;
}

http {
    # タイムアウトの設定
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # ログフォーマット
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 大きなファイルのアップロード（Infographicのbase64等）を許可する
    client_max_body_size 50M;

    # 80番ポートへのアクセスはすべてHTTPS(443)にリダイレクト
    server {
        listen 80;
        server_name _;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 443番ポート(HTTPS)の設定
    server {
        listen 443 ssl;
        server_name _;

        # 証明書のパス (docker-compose で ./certbot を /etc/letsencrypt にマウント)
        ssl_certificate /etc/letsencrypt/live/macosui-staging.techiespod.co.jp/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/macosui-staging.techiespod.co.jp/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Node.js サーバーへのリバースプロキシ
        location / {
            proxy_pass http://web:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Knowledge Base MCP Server への SSE 専用リバースプロキシ
        location /api/mcp/knowledge/ {
            proxy_pass http://web:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE (Server-Sent Events) 向けの設定
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding on;
        }

        # Agile-Agent-Staging へのリバースプロキシ
        location /agile-agent/ {
            proxy_pass http://agile-agent-staging:3001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AppRunner MCP Server へのリバースプロキシ
        location /app-server/ {
            proxy_pass http://apprunner-mcp-server:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Docker Monitor MCP Server へのリバースプロキシ
        location /docker-monitor/ {
            proxy_pass http://docker-monitor-mcp:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE (Server-Sent Events) 向けの設定
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding on;
        }
    }
}
