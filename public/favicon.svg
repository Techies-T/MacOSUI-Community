<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="eaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="eaText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="eaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.2)" />
    </linearGradient>
  </defs>
  <!-- Background macOS squircle -->
  <rect width="512" height="512" rx="115" fill="url(#eaBg)" />
  <rect width="496" height="496" x="8" y="8" rx="107" fill="none" stroke="url(#eaBorder)" stroke-width="12" />
  
  <!-- Text EA: Bold, Modern, High-contrast for tab visibility -->
  <text x="256" y="332" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
        font-size="248" 
        font-weight="900" 
        letter-spacing="-8" 
        fill="url(#eaText)" 
        text-anchor="middle">EA</text>
  
  <!-- AI Agent Sparkle / Accent -->
  <circle cx="396" cy="158" r="22" fill="#38BDF8" />
</svg>
