AWSTemplateFormatVersion: '2010-09-09'
Description: 'MacOSUI Infrastructure - Minimum EC2 instance with Amazon Linux 2023 Minimal for Testing'

Parameters:
  DataVolumeSize:
    Type: Number
    Default: 10
    Description: 'Size of the permanent data volume (EBS) in GB'
  InstanceType:
    Type: String
    Default: t3.micro
    Description: 'EC2 instance type'
  LatestAl2023Ami:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: 'SSM parameter path for the latest Amazon Linux 2023 AMI'

Resources:
  # VPC & Networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: MacOSUI-Test-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: MacOSUI-Test-IGW

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: MacOSUI-Test-Subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: MacOSUI-Test-RouteTable

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  # Security Group
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and HTTP traffic for testing
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: 'Allow SSH'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'Allow Nginx HTTP'
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: 'Allow App direct port'
      Tags:
        - Key: Name
          Value: MacOSUI-Test-SG

  # EC2 Instance
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: MacOSUI-Data-Volume

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref EC2Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAl2023Ami
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      Tags:
        - Key: Name
          Value: MacOSUI-Test-EC2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # System updates
          dnf update -y
          
          # --- Setup Persistent Data Volume ---
          # Wait for the attached volume (Nitro instances usually map /dev/sdf to /dev/nvme1n1)
          DEVICE_NAME=""
          for i in {1..12}; do
            DEVICE=$(lsblk -np | grep -v 'nvme0' | grep -v 'xvda' | awk 'NR==1{print $1}')
            if [ -n "$DEVICE" ]; then
              DEVICE_NAME=$DEVICE
              break
            fi
            sleep 5
          done

          if [ -n "$DEVICE_NAME" ]; then
            FS_TYPE=$(blkid -o value -s TYPE $DEVICE_NAME || true)
            if [ -z "$FS_TYPE" ]; then
              mkfs.ext4 $DEVICE_NAME
            fi
            mkdir -p /app/data
            mount $DEVICE_NAME /app/data
            if ! grep -q "/app/data" /etc/fstab; then
              echo "$DEVICE_NAME /app/data ext4 defaults,nofail 0 2" >> /etc/fstab
            fi
            chown -R ec2-user:ec2-user /app/data
          fi
          # ------------------------------------

          # Install Docker and Git
          dnf install -y docker git
          
          # Start and enable Docker
          systemctl start docker
          systemctl enable docker
          
          # Add ec2-user to docker group
          usermod -aG docker ec2-user
          
          # Install Docker Compose manually
          mkdir -p /usr/libexec/docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/libexec/docker/cli-plugins/docker-compose
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose
          
          # Create symlink for docker-compose compatibility (optional)
          ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose

          # Create a 2GB swap file using dd (required for npm build on t3.micro)
          if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' | tee -a /etc/fstab
          fi

          # Clone the repository
          mkdir -p /opt/macosui
          git clone "https://github.com/Techies-T/MacOSUI-Community.git" /opt/macosui/repo
          cd /opt/macosui/repo

          # Link the persistent data volume
          rm -rf data
          ln -s /app/data ./data
          
          # Initialize database file to ensure correct permissions
          touch /app/data/database.sqlite
          chmod 666 /app/data/database.sqlite

          # Build and start the application
          /usr/local/bin/docker-compose up -d --build

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
        - Key: Name
          Value: MacOSUI-Test-EC2Role

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

Outputs:
  EC2PublicIP:
    Description: 'Public IP address of the EC2 instance'
    Value: !GetAtt EC2Instance.PublicIp
  EC2PublicDNS:
    Description: 'Public DNS name of the EC2 instance'
    Value: !GetAtt EC2Instance.PublicDnsName
